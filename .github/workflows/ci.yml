name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run in flight for it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            back/package-lock.json
            front/package-lock.json

      - name: Install
        run: |
          npm ci
          npm run install:all

      # One linter for the whole repo. oxlint rather than ESLint because
      # typescript-eslint still caps TypeScript below 6.1 and this project is
      # on 7 — see docs/ANALYSIS.md.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Checked rather than trusted: without this, the config is only a
      # suggestion and the style drifts back apart one editor at a time.
      - name: Format
        run: npm run format:check

      # The backend suite binds ephemeral ports and drives real socket.io
      # clients, so it needs no services — but it is timing-sensitive, and a
      # loaded runner is exactly where that shows up.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
